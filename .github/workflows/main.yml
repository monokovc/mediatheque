name: Construire l'APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Trouver le projet
        id: p
        run: |
          d=$(dirname "$(find . -name settings.gradle -not -path '*/node_modules/*' | head -1)")
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          echo "Projet dans : $d"
          ls -la "$d"
      - name: Compiler
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Renommer
        run: cp "${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" Mediatheque.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mediatheque-apk
          path: Mediatheque.apk
      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mediatheque ${{ github.run_number }}
          files: Mediatheque.apk
